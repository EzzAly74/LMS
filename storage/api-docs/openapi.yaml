        '200': { description: Paginated forms }
    post:
      tags: [Forms]
      summary: Create form (admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: object
                  required: [ar]
                  properties:
                    ar: { type: string }
                    en: { type: string }
                duration:  { type: integer }
                full_mark: { type: integer }
                active:    { type: boolean }
      responses:
        '201': { description: Form created }

  /forms/{form}:
    parameters:
      - name: form
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Forms]
      summary: Get form with questions (admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Form detail with questions }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Forms]
      summary: Update form (admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:     { type: object }
                duration:  { type: integer }
                full_mark: { type: integer }
                active:    { type: boolean }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Forms]
      summary: Delete form (admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }

  /forms/{form}/questions:
    parameters:
      - name: form
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Forms]
      summary: Add question to form (admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, question]
              properties:
                type:     { type: string, enum: [text, radio, yes_no] }
                question:
                  type: object
                  required: [ar]
                  properties:
                    ar: { type: string }
                    en: { type: string }
                answers:
                  type: array
                  description: "Required when type is radio or yes_no"
                  items:
                    type: object
                    properties:
                      answer:
                        type: object
                        properties:
                          ar: { type: string }
                          en: { type: string }
      responses:
        '201': { description: Question added }
        '422': { $ref: '#/components/responses/ValidationError' }

  /forms/{form}/questions/{question}:
    parameters:
      - name: form
        in: path
        required: true
        schema: { type: integer }
      - name: question
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Forms]
      summary: Remove question from form (admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Question removed }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # NOTIFICATIONS
  # ===========================================================================

  /notifications:
    get:
      tags: [Notifications]
      summary: Paginated notifications (admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200': { description: Paginated notifications }
    post:
      tags: [Notifications]
      summary: Send notification (admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title:
                  type: object
                  required: [ar]
                  properties:
                    ar: { type: string }
                    en: { type: string }
                body:
                  type: object
                  required: [ar]
                  properties:
                    ar: { type: string }
                    en: { type: string }
                for_public:  { type: boolean, description: "true = broadcast to all users" }
                user_codes:
                  type: array
                  description: "Required when for_public is false"
                  items: { type: string }
      responses:
        '201': { description: Notification sent and stored }
        '422': { $ref: '#/components/responses/ValidationError' }

  /notifications/{notification}:
    parameters:
      - name: notification
