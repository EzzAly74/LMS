      tags: [Admins]
      summary: Create admin account (admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, role]
              properties:
                name:                  { type: string }
                email:                 { type: string, format: email }
                password:              { type: string, minLength: 8 }
                password_confirmation: { type: string }
                role:                  { type: string, description: "Role name from roles table" }
      responses:
        '201': { description: Admin created }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admins/{admin}:
    parameters:
      - name: admin
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Admins]
      summary: Get admin (admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Admin detail }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admins]
      summary: Update admin (admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name:                  { type: string }
                email:                 { type: string, format: email }
                password:              { type: string, minLength: 8, nullable: true }
                password_confirmation: { type: string }
                role:                  { type: string }
      responses:
        '200': { description: Admin updated }
        '404': { $ref: '#/components/responses/NotFound' }
