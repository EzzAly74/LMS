      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # DASHBOARD
  # ===========================================================================

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Platform statistics (admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Dashboard statistics and top courses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          statistics:  { $ref: '#/components/schemas/DashboardStats' }
                          top_courses:
                            type: array
                            items:
                              type: object
                              properties:
                                id:          { type: integer }
                                title:       { $ref: '#/components/schemas/TranslatedString' }
                                users_count: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===========================================================================
  # CERTIFICATES
  # ===========================================================================

  /certificates:
    get:
      tags: [Certificates]
      summary: List all earned certificates (admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: course_id
          in: query
          schema: { type: integer }
          description: Filter by course
      responses:
        '200':
          description: Paginated certificates (merged exam + evaluation certificates)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/Certificate' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===========================================================================
  # PROGRESS
  # ===========================================================================

  /progress:
    get:
      tags: [Progress]
      summary: User course progress report (admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: course_id
          in: query
          schema: { type: integer }
        - name: group_id
          in: query
          schema: { type: integer }
        - name: user_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Paginated progress records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      result:
                        type: array
                        items:
                          type: object
                          properties:
                            user:
                              type: object
                              properties:
                                id:              { type: integer }
                                name:            { type: string }
                                machine_code:    { type: string }
                                department_name: { type: string }
                            course:
                              type: object
                              properties:
                                id:          { type: integer }
                                title:       { type: string }
                                course_type: { type: string }
                                for_public:  { type: boolean }
                            group_name:   { type: string, nullable: true }
                            user_degree:  { type: number, nullable: true }
                            total_degree: { type: number, nullable: true }
                            progress:     { type: integer, description: "0 or 100" }
        '403': { $ref: '#/components/responses/Forbidden' }
