openapi: 3.0.3
info:
  title: 2B Academy LMS API
  description: |
    RESTful API for the 2B Academy Learning Management System.
    All endpoints are prefixed with `/api/v1`.

    **Authentication:** Protected endpoints require a Bearer token obtained from the login endpoints.
    Include it in all requests as: `Authorization: Bearer <token>`

    **Response format:**
    ```json
    { "status": "success|error", "message": "...", "result": {} }
    ```
    Paginated responses also include a `meta` key:
    ```json
    { "meta": { "current_page": 1, "last_page": 5, "per_page": 20, "total": 100 } }
    ```

    **Translatable fields** return bilingual objects:
    ```json
    { "ar": "اسم عربي", "en": "English name" }
    ```
  version: 1.0.0
  contact:
    name: 2B Academy API

servers:
  - url: /api/v1
    description: API v1

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:

    TranslatedString:
      type: object
      properties:
        ar: { type: string }
        en: { type: string }
      example:
        ar: "نص عربي"
        en: "English text"

    SuccessResponse:
      type: object
      properties:
        status: { type: string, example: success }
        message: { type: string }
        result: {}

    CreatedResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'

    PaginatedResponse:
      type: object
      properties:
        status: { type: string, example: success }
        message: { type: string }
        result: { type: array, items: {} }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            last_page:    { type: integer }
            per_page:     { type: integer }
            total:        { type: integer }

    ErrorResponse:
      type: object
      properties:
        status: { type: string, example: error }
        error:  { type: string }

    ValidationErrorResponse:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    # -------------------------------------------------------------------------
    # Domain schemas
    # -------------------------------------------------------------------------

    User:
      type: object
      properties:
        id:              { type: integer }
        name:            { type: string }
        email:           { type: string, format: email }
        phone:           { type: string, nullable: true }
        system_id:       { type: string, nullable: true }
        machine_code:    { type: string, nullable: true }
        department_name: { type: string, nullable: true }
        roles:           { type: array, items: { type: string } }
        created_at:      { type: string, format: date-time }

    Admin:
      type: object
      properties:
        id:         { type: integer }
        name:       { type: string }
        email:      { type: string, format: email }
        roles:      { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }

    Category:
      type: object
      properties:
        id:           { type: integer }
        name:         { $ref: '#/components/schemas/TranslatedString' }
        logo_url:     { type: string, format: uri }
        active:       { type: boolean }
        courses_count: { type: integer }

    Instructor:
      type: object
      properties:
        id:        { type: integer }
        name:      { $ref: '#/components/schemas/TranslatedString' }
        bio:       { $ref: '#/components/schemas/TranslatedString' }
        job_title: { $ref: '#/components/schemas/TranslatedString' }
        image_url: { type: string, format: uri, nullable: true }

    Course:
      type: object
      properties:
        id:                   { type: integer }
        title:                { $ref: '#/components/schemas/TranslatedString' }
        description:          { $ref: '#/components/schemas/TranslatedString' }
        title_for_certificate: { $ref: '#/components/schemas/TranslatedString', nullable: true }
        image_url:            { type: string, format: uri }
        category:
          type: object
          properties:
            id:   { type: integer }
            name: { $ref: '#/components/schemas/TranslatedString' }
        instructors:
          type: array
          items:
            type: object
            properties:
              id:   { type: integer }
              name: { $ref: '#/components/schemas/TranslatedString' }
        course_type:       { type: string, enum: [online, offline] }
        hours:             { type: integer }
        level:             { type: string, nullable: true }
        language:          { type: string, nullable: true }
        certificate:       { type: boolean }
        active:            { type: boolean }
        is_evaluate:       { type: boolean }
        allow_attendances: { type: boolean }
        price:             { type: number }
        currency:          { type: string }

    CourseSection:
      type: object
      properties:
        id:        { type: integer }
        course_id: { type: integer }
        name:      { $ref: '#/components/schemas/TranslatedString' }
        order:     { type: integer }

    CourseLecture:
      type: object
      properties:
        id:         { type: integer }
        section_id: { type: integer }
        title:      { $ref: '#/components/schemas/TranslatedString' }
        type:       { type: string, enum: [url, file] }
        video_url:  { type: string, nullable: true }
        order:      { type: integer }

    CourseExam:
      type: object
      properties:
        id:         { type: integer }
        section_id: { type: integer }
        title:      { $ref: '#/components/schemas/TranslatedString' }
        degree:     { type: integer }
        is_final:   { type: boolean }
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ExamQuestion'

    ExamQuestion:
      type: object
      properties:
        id:       { type: integer }
        question: { $ref: '#/components/schemas/TranslatedString' }
        answers:
          type: array
          items:
            type: object
            properties:
              id:         { type: integer }
              answer:     { $ref: '#/components/schemas/TranslatedString' }
              is_correct: { type: boolean }

    EvaluationCategory:
      type: object
      properties:
        id:   { type: integer }
        name: { $ref: '#/components/schemas/TranslatedString' }

    Evaluation:
      type: object
      properties:
        id:                    { type: integer }
        evaluation_category_id: { type: integer }
        category:              { $ref: '#/components/schemas/EvaluationCategory' }
        title:                 { $ref: '#/components/schemas/TranslatedString' }
        type:                  { type: string, enum: [text, five, ten] }
        is_required:           { type: boolean }

    Form:
      type: object
      properties:
        id:         { type: integer }
        title:      { $ref: '#/components/schemas/TranslatedString' }
        duration:   { type: integer, nullable: true }
        full_mark:  { type: integer, nullable: true }
        active:     { type: boolean }
        questions:
          type: array
          items:
            $ref: '#/components/schemas/FormQuestion'

    FormQuestion:
      type: object
      properties:
        id:       { type: integer }
        type:     { type: string, enum: [text, radio, yes_no] }
        question: { $ref: '#/components/schemas/TranslatedString' }
        answers:
          type: array
          items:
            type: object
            properties:
              id:     { type: integer }
              answer: { $ref: '#/components/schemas/TranslatedString' }

    PublicNotification:
      type: object
      properties:
        id:         { type: integer }
        title:      { $ref: '#/components/schemas/TranslatedString' }
        body:       { $ref: '#/components/schemas/TranslatedString' }
        for_public: { type: boolean }
        users:      { type: array, items: { type: string }, description: "user_codes of targeted users" }
        created_at: { type: string, format: date-time }

    Article:
      type: object
      properties:
        id:          { type: integer }
        title:       { $ref: '#/components/schemas/TranslatedString' }
        description: { $ref: '#/components/schemas/TranslatedString' }
        slug:        { type: string }
        type:        { type: string, enum: [news, blogs, event] }
        image_url:   { type: string, format: uri, nullable: true }
        is_home:     { type: boolean }
        active:      { type: boolean }
        created_at:  { type: string, format: date-time }

    About:
      type: object
      properties:
        id:      { type: integer, nullable: true }
        about:   { $ref: '#/components/schemas/TranslatedString' }
        mission: { $ref: '#/components/schemas/TranslatedString' }
        vision:  { $ref: '#/components/schemas/TranslatedString' }
        goals:   { $ref: '#/components/schemas/TranslatedString' }

    Testimonial:
      type: object
      properties:
        id:          { type: integer }
        name:        { $ref: '#/components/schemas/TranslatedString' }
        description: { $ref: '#/components/schemas/TranslatedString' }
        image_url:   { type: string, format: uri, nullable: true }
        active:      { type: boolean }

    Role:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string }
        permissions: { type: array, items: { type: string } }

    Certificate:
      type: object
      properties:
        type:         { type: string, enum: [exam, evaluation] }
        user:
          type: object
          properties:
            id:              { type: integer }
            name:            { type: string }
            machine_code:    { type: string, nullable: true }
            department_name: { type: string, nullable: true }
        course:
          type: object
          properties:
            id:                    { type: integer }
            title:                 { $ref: '#/components/schemas/TranslatedString' }
            title_for_certificate: { $ref: '#/components/schemas/TranslatedString', nullable: true }
        user_degree:  { type: number, nullable: true }
        total_degree: { type: number, nullable: true }
        created_at:   { type: string, format: date-time }

    CourseAssignment:
      type: object
      properties:
        id:         { type: integer }
        course_id:  { type: integer }
        title:      { type: string }
        file_url:   { type: string, format: uri }
        created_at: { type: string, format: date-time }

    UserCourseAssignment:
      type: object
      properties:
        id:            { type: integer }
        assignment:    { $ref: '#/components/schemas/CourseAssignment' }
        user:
          type: object
          properties:
            id:              { type: integer }
            name:            { type: string }
            machine_code:    { type: string, nullable: true }
            department_name: { type: string, nullable: true }
        user_file_url: { type: string, format: uri, nullable: true }
        feedback:      { type: string, nullable: true }
        score:         { type: string, nullable: true }
        created_at:    { type: string, format: date-time }

    CourseSession:
      type: object
      properties:
        id:           { type: integer }
        course_id:    { type: integer }
        section:
          type: object
          properties:
            id:   { type: integer }
            name: { $ref: '#/components/schemas/TranslatedString' }
        title:        { type: string }
        session_date: { type: string, format: date, nullable: true }
        time_from:    { type: string, nullable: true }
        time_to:      { type: string, nullable: true }
        location:     { type: string, nullable: true }
        created_at:   { type: string, format: date-time }

    Enrollment:
      type: object
      properties:
        id:         { type: integer }
        user:
          type: object
          properties:
            id:              { type: integer }
            name:            { type: string }
            machine_code:    { type: string, nullable: true }
            department_name: { type: string, nullable: true }
        group:
          type: object
          nullable: true
          properties:
            id:   { type: integer }
            name: { $ref: '#/components/schemas/TranslatedString' }
        created_at: { type: string, format: date-time }

    DashboardStats:
      type: object
      properties:
        courses:              { type: integer }
        users:                { type: integer }
        instructors:          { type: integer }
        articles:             { type: integer }
        ratings:              { type: integer }
        lecture_questions:    { type: integer }
        unanswered_questions: { type: integer }
        user_assignments:     { type: integer }

  # -------------------------------------------------------------------------
  # Reusable parameters
  # -------------------------------------------------------------------------
  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    PerPageParam:
      name: per_page
      in: query
      schema: { type: integer, default: 20 }
    SearchParam:
      name: search
      in: query
      schema: { type: string }

  # -------------------------------------------------------------------------
  # Reusable responses
  # -------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorResponse' }

# =============================================================================
# Tags
# =============================================================================
tags:
  - { name: Auth,               description: "User & admin authentication" }
  - { name: Categories,         description: "Course category management" }
  - { name: Courses,            description: "Course CRUD" }
  - { name: Course Sections,    description: "Sections within a course" }
  - { name: Course Lectures,    description: "Lectures within a course" }
  - { name: Course Exams,       description: "Exams with questions and answers" }
  - { name: Course Assignments, description: "Admin assignments + user submissions" }
  - { name: Course Sessions,    description: "Offline session scheduling" }
  - { name: Enrollments,        description: "Offline course user enrollment" }
  - { name: Users,              description: "User management (admin)" }
  - { name: Instructors,        description: "Instructor management" }
  - { name: Evaluation Categories, description: "Evaluation category management" }
  - { name: Evaluations,        description: "Evaluation CRUD" }
  - { name: Forms,              description: "Form and question management" }
  - { name: Notifications,      description: "Public notification broadcasts" }
  - { name: Articles,           description: "News, blogs, and events" }
  - { name: CMS,                description: "About page and testimonials" }
  - { name: Roles,              description: "Spatie role management" }
  - { name: Admins,             description: "Admin account management" }
  - { name: Dashboard,          description: "Platform statistics" }
  - { name: Certificates,       description: "User certificate listing" }
  - { name: Progress,           description: "User course progress reporting" }

# =============================================================================
# Paths
# =============================================================================
paths:

  # ===========================================================================
  # AUTH
  # ===========================================================================

  /auth/user/login:
    post:
      tags: [Auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          token: { type: string }
                          user:  { $ref: '#/components/schemas/User' }
        '401': { description: Invalid credentials }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/user/logout:
    post:
      tags: [Auth]
      summary: Logout current user session
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/user/logout-all:
    post:
      tags: [Auth]
      summary: Logout all user sessions
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: All sessions invalidated }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/user/me:
    get:
      tags: [Auth]
      summary: Get authenticated user profile
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/admin/login:
    post:
      tags: [Auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          token: { type: string }
                          admin: { $ref: '#/components/schemas/Admin' }
        '401': { description: Invalid credentials }

  /auth/admin/logout:
    post:
      tags: [Auth]
      summary: Admin logout
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/admin/me:
    get:
      tags: [Auth]
      summary: Get authenticated admin profile
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Admin profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===========================================================================
  # CATEGORIES
  # ===========================================================================

  /categories/active:
    get:
      tags: [Categories]
      summary: List all active categories (public)
      responses:
        '200':
          description: Active categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      result:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }

  /categories:
    get:
      tags: [Categories]
      summary: Paginated category list (admin)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated categories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Categories]
      summary: Create category (admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, logo]
              properties:
                name:   { type: string }
                logo:   { type: string, format: binary }
                active: { type: boolean }
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreatedResponse'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories/{category}:
    parameters:
      - name: category
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Categories]
      summary: Get single category (admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Category detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categories]
      summary: Update category (admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name]
              properties:
                name:   { type: string }
                logo:   { type: string, format: binary }
                active: { type: boolean }
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Categories]
      summary: Delete category (admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # COURSES
  # ===========================================================================

  /courses:
    get:
      tags: [Courses]
      summary: Paginated course list (any authenticated user)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: category_id
          in: query
          schema: { type: integer }
        - name: course_type
          in: query
          schema: { type: string, enum: [online, offline] }
      responses:
        '200':
          description: Paginated courses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Courses]
      summary: Create course (admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, description, category_id, hours, certificate, image, instructors]
              properties:
                title:                 { type: string }
                description:           { type: string }
                title_for_certificate: { type: string }
                category_id:           { type: integer }
                course_type:           { type: string, enum: [online, offline] }
                hours:                 { type: integer }
                language:              { type: string }
                level:                 { type: string }
                certificate:           { type: boolean }
                active:                { type: boolean }
                is_evaluate:           { type: boolean }
                allow_attendances:     { type: boolean }
                price:                 { type: number }
                currency:              { type: string }
                image:                 { type: string, format: binary }
                intro_video:           { type: string }
                instructors:
                  type: array
                  items: { type: integer }
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreatedResponse'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Course' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /courses/{course}:
    parameters:
      - name: course
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Courses]
      summary: Get single course (any authenticated user)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      result: { $ref: '#/components/schemas/Course' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Courses]
      summary: Update course (admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:       { type: string }
                description: { type: string }
                category_id: { type: integer }
                hours:       { type: integer }
                certificate: { type: boolean }
                image:       { type: string, format: binary }
                instructors:
                  type: array
                  items: { type: integer }
      responses:
        '200': { description: Course updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Courses]
